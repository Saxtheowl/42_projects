spring:
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
consumer:
  queue: ${CONSUMER_QUEUE:grant_other_documents}
  routing-key: ${CONSUMER_ROUTING_KEY:grant.*}
exchanges:
  grant: ${GRANT_EXCHANGE:GRANT_EXCHANGE}
