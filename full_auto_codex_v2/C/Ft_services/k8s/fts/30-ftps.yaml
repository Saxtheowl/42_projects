apiVersion: v1
kind: ConfigMap
metadata:
  name: ftps-config
  namespace: ft-services
data:
  users.txt: |
    ftpsuser:ftpspass
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ftps
  namespace: ft-services
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ftps
  template:
    metadata:
      labels:
        app: ftps
    spec:
      containers:
        - name: ftps
          image: fauria/vsftpd
          env:
            - name: FTP_USER
              value: ftpsuser
            - name: FTP_PASS
              value: ftpspass
            - name: PASV_ADDRESS
              value: 0.0.0.0
            - name: PASV_MIN_PORT
              value: "30000"
            - name: PASV_MAX_PORT
              value: "30010"
          ports:
            - containerPort: 21
            - containerPort: 30000
            - containerPort: 30001
            - containerPort: 30002
            - containerPort: 30003
            - containerPort: 30004
            - containerPort: 30005
            - containerPort: 30006
            - containerPort: 30007
            - containerPort: 30008
            - containerPort: 30009
            - containerPort: 30010
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "nc -z localhost 21"]
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ftps
  namespace: ft-services
spec:
  selector:
    app: ftps
  type: LoadBalancer
  ports:
    - name: control
      port: 21
      targetPort: 21
    - name: pasv-30000
      port: 30000
      targetPort: 30000
    - name: pasv-30001
      port: 30001
      targetPort: 30001
    - name: pasv-30002
      port: 30002
      targetPort: 30002
    - name: pasv-30003
      port: 30003
      targetPort: 30003
    - name: pasv-30004
      port: 30004
      targetPort: 30004
    - name: pasv-30005
      port: 30005
      targetPort: 30005
    - name: pasv-30006
      port: 30006
      targetPort: 30006
    - name: pasv-30007
      port: 30007
      targetPort: 30007
    - name: pasv-30008
      port: 30008
      targetPort: 30008
    - name: pasv-30009
      port: 30009
      targetPort: 30009
    - name: pasv-30010
      port: 30010
      targetPort: 30010
