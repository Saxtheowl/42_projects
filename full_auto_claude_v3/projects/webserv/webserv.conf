# Webserv Configuration File

server {
	listen 8080
	server_name localhost

	root ./www
	index index.html

	client_max_body_size 10485760

	error_page 404 ./www/404.html
	error_page 500 ./www/500.html

	location / {
		root ./www
		methods GET POST DELETE
		autoindex on
	}

	location /uploads {
		root ./www/uploads
		methods GET POST DELETE
		upload_dir ./www/uploads
	}

	location /cgi-bin {
		root ./www/cgi-bin
		methods GET POST
		cgi_extension .py
		cgi_path /usr/bin/python3
	}
}
